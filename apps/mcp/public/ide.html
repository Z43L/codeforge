<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CodeForge IDE</title>
<style>
:root{color-scheme:light dark;--cf-bg:var(--color-background-primary,transparent);--cf-surface:var(--color-background-secondary,#f7f7f8);--cf-fg:var(--color-text-primary,#171717);--cf-muted:var(--color-text-secondary,#6b7280);--cf-line:var(--color-border,#dedede);--cf-good:var(--color-text-success,#16804a);--cf-bad:var(--color-text-danger,#c0392b);--cf-code:var(--color-background-secondary,#f7f7f8);--cf-radius:12px}
*{box-sizing:border-box}body{margin:0;background:var(--cf-bg);color:var(--cf-fg);font:14px/1.65 var(--font-sans,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif)}button,select,textarea{font:inherit}button,select{border:1px solid var(--cf-line);border-radius:9px;padding:7px 10px;background:var(--cf-bg);color:var(--cf-fg)}button{cursor:pointer;transition:background .12s ease}button:hover:not(:disabled){background:var(--cf-surface)}button.primary{background:var(--cf-fg);color:var(--cf-bg);border-color:transparent;font-weight:600}button.primary:hover:not(:disabled){opacity:.88}button:disabled{opacity:.5;cursor:wait}
.shell{display:flex;flex-direction:column;gap:20px;padding:2px 0 8px;max-width:100%;min-width:0}.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.topbar-controls{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.status{font-size:12px;color:var(--cf-muted);line-height:1.4}.status.good{color:var(--cf-good)}.status.bad{color:var(--cf-bad)}
.challenge-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}h1{font-size:clamp(21px,3vw,27px);line-height:1.25;letter-spacing:-.55px;font-weight:650;margin:0}.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:9px}.difficulty,.meta-dot{font-size:12px;color:var(--cf-muted)}.topics{display:inline-flex;gap:6px;flex-wrap:wrap}.topic{font-size:12px;color:var(--cf-muted)}.topic:not(:last-child)::after{content:"·";margin-left:6px;color:var(--cf-muted)}
.prose{min-width:0;color:var(--cf-fg);font-size:14px;line-height:1.75}.statement{white-space:pre-wrap;overflow-wrap:anywhere;margin:0}.section-heading{font-size:16px;line-height:1.4;font-weight:600;letter-spacing:-.15px;margin:19px 0 9px}.examples-list{display:flex;flex-direction:column;gap:12px}.example{margin:0;min-width:0}.example-label{font-size:13px;font-weight:600;margin:0 0 6px}.example-code{display:block;margin:0;padding:11px 13px;border:1px solid var(--cf-line);border-radius:var(--cf-radius);background:var(--cf-code);color:var(--cf-fg);font:12.5px/1.6 var(--font-mono,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace);white-space:pre-wrap;overflow-wrap:anywhere;overflow-x:auto}.example-explanation{margin:7px 0 0;color:var(--cf-muted)}.constraints{margin:0;padding-left:22px;line-height:1.7}.constraints li{padding-left:2px}
.workspace{display:flex;flex-direction:column;gap:13px;min-width:0}.codeblock,.result-block{overflow:hidden;border:1px solid var(--cf-line);border-radius:var(--cf-radius);background:var(--cf-code);min-width:0}.code-header{display:flex;align-items:center;gap:8px;min-height:42px;padding:6px 9px 6px 12px;border-bottom:1px solid var(--cf-line)}.code-label{font-size:12px;font-weight:550;color:var(--cf-muted);display:flex;align-items:center;gap:7px}.code-glyph{font:13px/1 var(--font-mono,ui-monospace,monospace);color:var(--cf-fg)}.code-header .spacer,.actions .spacer,.result-head .spacer{flex:1}.code-header select{font-size:12px;padding:5px 8px;border-color:transparent;background:transparent;max-width:170px}.code-header button{font-size:12px;padding:5px 8px;border-color:transparent;background:transparent}textarea#code{display:block;width:100%;height:320px;min-height:220px;resize:vertical;border:0;outline:none;border-radius:0;padding:13px 15px;background:transparent;color:var(--cf-fg);font:13px/1.65 var(--font-mono,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace);tab-size:2;white-space:pre;overflow:auto;caret-color:var(--cf-fg);box-shadow:none}textarea#code:focus{outline:none}
.io-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}.field-label{display:block;font-size:13px;font-weight:600;margin:0 0 7px}textarea#stdin{display:block;width:100%;min-height:76px;resize:vertical;border:1px solid var(--cf-line);border-radius:10px;padding:10px 12px;background:var(--cf-bg);color:var(--cf-fg);font:12.5px/1.6 var(--font-mono,ui-monospace,monospace)}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.shortcut{font-size:11px;color:var(--cf-muted)}.result-head{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--cf-line)}.result-title{font-size:12px;font-weight:600}.result{margin:0;min-height:48px;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere;overflow-x:auto;font:12.5px/1.6 var(--font-mono,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace);color:var(--cf-muted)}.result.good{color:var(--cf-good)}.result.bad{color:var(--cf-bad)}.bottom{font-size:11px;color:var(--cf-muted);line-height:1.5}
@media(max-width:520px){.shell{gap:17px}.challenge-heading{gap:10px}.topbar{align-items:flex-start}.topbar-controls{width:100%}#problemSelect{max-width:100%;min-width:0;flex:1}textarea#code{height:270px;padding:11px;font-size:12px}.code-header{padding-left:9px}.shortcut{display:none}}

html,body{min-he<body><div class="shell">
<header class="topbar"><span class="code-label"><span class="code-glyph">&lt;/&gt;</span> CodeForge</span><span id="connection" class="status">Conectando…</span></header>
<section class="workspace" aria-label="Editor de solución">
<div class="codeblock"><div class="code-header"><span class="code-label">Solución</span><span id="languageHint" class="status">C++</span><span class="spacer"></span><button id="reset" type="button">Restaurar</button></div>
<div class="editor-scroll"><textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Editor de código" placeholder="// Escribe tu solución aquí"></textarea></div></div>
<div class="io-grid"><div><label for="stdin" class="field-label">Entrada de prueba (stdin)</label><textarea id="stdin" spellcheck="false" aria-label="Entrada estándar"></textarea></div></div>
<div class="actions"><button id="run" class="primary" type="button">▶ Ejecutar</button><button id="submit" type="button">Enviar solución</button><span class="spacer"></span><span class="shortcut">⌘/Ctrl + Enter para ejecutar</span><span id="runStatus" class="status">Listo</span></div>
<div class="result-block"><div class="result-head"><span class="result-title">Resultado</span><span class="spacer"></span></div><pre id="result" class="result muted">La salida del juez aparecerá aquí.</pre></div>
</section></div>
ctions"><button id="run" class="primary" type="button">▶ Ejecutar</button><button id="submit" type="button">Enviar solución</button><span class="spacer"></span><span class="shortcut">⌘/Ctrl + Enter para ejecutar</span><span id="runStatus" class="status">Listo</span></div>
    <div class="result-block"><div class="result-head"><span class="result-title">Resultado</span><span class="spacer"></span></div><pre id="result" class="result muted">La salida del juez aparecerá aquí.</pre></div>
  </section>
  <div class="bottom">CodeForge utiliza el juez remoto conectado. Ejecuta únicamente código que entiendas; la ejecución depende de la disponibilidad del servicio.</div>
</div>
<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id)};
var state={problem:null,languages:[],problems:[],busy:false};
var languagesFallback=[
{id:50,name:"C"},{id:54,name:"C++"},{id:51,name:"C#"},{id:62,name:"Java"},{id:63,name:"JavaScript"},{id:74,name:"TypeScript"},{id:71,name:"Python 3"},{id:60,name:"Go"},{id:73,name:"Rust"},{id:78,name:"Kotlin"},{id:83,name:"Swift"},{id:68,name:"PHP"},{id:72,name:"Ruby"}
];
var templates={
"TypeScript":"const fs = require('fs');\nconst input = fs.readFileSync(0, 'utf8').trim().split(/\\s+/).map(Number);\nconst n = input[0];\nconst nums = input.slice(1, n + 1);\nconst target = input[n + 1];\nconst seen = new Map();\nfor (let i = 0; i < nums.length; i++) {\n  const other = target - nums[i];\n  if (seen.has(other)) { console.log(seen.get(other) + ' ' + i); break; }\n  seen.set(nums[i], i);\n}",
"JavaScript":"const fs = require('fs');\nconst input = fs.readFileSync(0, 'utf8').trim().split(/\\s+/).map(Number);\nconst n = input[0];\nconst nums = input.slice(1, n + 1);\nconst target = input[n + 1];\nconst seen = new Map();\nfor (let i = 0; i < nums.length; i++) {\n  const other = target - nums[i];\n  if (seen.has(other)) { console.log(seen.get(other) + ' ' + i); break; }\n  seen.set(nums[i], i);\n}",
"Python 3":"import sys\nvalues = list(map(int, sys.stdin.read().split()))\nn = values[0]\nnums = values[1:n + 1]\ntarget = values[n + 1]\nseen = {}\nfor i, value in enumerate(nums):\n    other = target - value\n    if other in seen:\n        print(seen[other], i)\n        break\n    seen[value] = i",
"C++":"#include <iostream>\n#include <vector>\n#include <unordered_map>\nusing namespace std;\nint main() {\n    int n, target;\n    cin >> n;\n    vector<int> nums(n);\n    for (int i = 0; i < n; ++i) cin >> nums[i];\n    cin >> target;\n    unordered_map<int, int> seen;\n    for (int i = 0; i < n; ++i) {\n        int other = target - nums[i];\n        if (seen.count(other)) { cout << seen[other] << \" \" << i << \"\\n\"; return 0; }\n        seen[nums[i]] = i;\n    }\n    return 0;\n}",
"Python":"import sys\nvalues = list(map(int, sys.stdin.read().split()))\nn = values[0]\nnums = values[1:n + 1]\ntarget = values[n + 1]\nseen = {}\nfor i, value in enumerate(nums):\n    if target - value in seen:\n        print(seen[target - value], i)\n        break\n    seen[value] = i"
};
var defaults={
"two-sum":"4\n2 7 11 15\n9",
"valid-palindrome":"A man, a plan, a canal: Panama",
"max-subarray":"9\n-2 1 -3 4 -1 2 1 -5 4"
};
function setStatus(message,kind){$("runStatus").textContent=message;$("runStatus").className="status"+(kind?" "+kind:"")}
function setConnection(message,kind){$("connection").textContent=message;$("connection").className="status"+(kind?" "+kind:"")}
function currentLanguage(){return state.activeLanguage||languagesFallback.find(function(l){return l.name==="C++"})||languagesFallback[1]}
function fallbackCode(problem){var lang=currentLanguage().name;if(problem&&problem.starterCode&&problem.starterCode[lang])return problem.starterCode[lang];return templates[lang]||"// Implementa la solución y lee la entrada desde stdin.\n"}
function setCodeForProblem(){var p=state.problem;if(!p)return;var lang=currentLanguage().name;$("code").value=(p.id==="two-sum"&&templates[lang])?templates[lang]:fallbackCode(p);$("stdin").value=p.sampleInput||defaults[p.id]||"";$("result").textContent="La salida del juez aparecerá aquí.";$("result").className="result muted";setStatus("Listo")}
function renderProblem(p){if(!p)return;state.problem=p;setCodeForProblem()}
function fillLanguages(items){
 state.languages=items&&items.length?items:languagesFallback;
 state.activeLanguage=state.languages.find(function(l){return l.name==="C++"||l.name.indexOf("C++")===0})||state.languages.find(function(l){return l.name==="TypeScript"})||state.languages[0]||languagesFallback[1];
 $("languageHint").textContent=state.activeLanguage.name;
}
var rpcId=0,pendingRequests=new Map(),bridgeReady;
function rpcNotify(method,params){window.parent.postMessage({jsonrpc:"2.0",method:method,params:params||{}}, "*")}
function rpcRequest(method,params){return new Promise(function(resolve,reject){var id=++rpcId;var timer=setTimeout(function(){pendingRequests.delete(id);reject(new Error("ChatGPT no respondió a "+method+". Comprueba que CodeForge está conectado como una app MCP."))},15000);pendingRequests.set(id,{resolve:function(value){clearTimeout(timer);resolve(value)},reject:function(error){clearTimeout(timer);reject(error)}});window.parent.postMessage({jsonrpc:"2.0",id:id,method:method,params:params||{}}, "*")})}
function updateFromResponse(response){var data=response&&(response.structuredContent||(response.result&&response.result.structuredContent));if(!data)return;if(data.languages)fillLanguages(data.languages);if(data.problems)fillProblems(data.problems);if(data.problem){renderProblem(data.problem);setConnection("API conectada","good")}if(data.submission){var s=data.submission;var lines=["Veredicto: "+(s.verdict||"Resultado recibido")];if(s.stdout)lines.push("stdout:\\n"+s.stdout);if(s.stderr)lines.push("stderr:\\n"+s.stderr);if(s.compileOutput)lines.push("Compilación:\\n"+s.compileOutput);$("result").textContent=lines.join("\\n\\n")}}
window.addEventListener("message",function(event){if(event.source!==window.parent)return;var message=event.data;if(!message||message.jsonrpc!=="2.0")return;if(Object.prototype.hasOwnProperty.call(message,"id")){var pending=pendingRequests.get(message.id);if(!pending)return;pendingRequests.delete(message.id);if(message.error)pending.reject(new Error(message.error.message||JSON.stringify(message.error)));else pending.resolve(message.result);return}if(message.method==="ui/notifications/tool-result")updateFromResponse(message.params)}, {passive:true});
async function initializeBridge(){await rpcRequest("ui/initialize",{appInfo:{name:"codeforge-ide",version:"0.2.0"},appCapabilities:{},protocolVersion:"2026-01-26"});rpcNotify("ui/notifications/initialized",{})}
bridgeReady=initializeBridge();
async function callTool(name,args){await bridgeReady;var result=await rpcRequest("tools/call",{name:name,arguments:args||{}});if(result&&result.isError){var message=(result.content||[]).filter(function(x){return x.type==="text"}).map(function(x){return x.text}).join("\\n");throw new Error(message||"La herramienta "+name+" ha fallado")}return (result&&result.structuredContent)||(result&&result.result&&result.result.structuredContent)||result||{}}
async function initialize(){
 fillLanguages(languagesFallback);
 try{await bridgeReady;setConnection("IDE conectado","good")}
 catch(e){setConnection("Sin conexión con ChatGPT","bad");$("result").textContent=e.message}
}
async function execute(submit){if(state.busy)return;var p=state.problem;if(!p){setStatus("Carga un reto primero","bad");return}var lang=currentLanguage();state.busy=true;$("run").disabled=true;$("submit").disabled=true;setStatus(submit?"Enviando…":"Ejecutando…");$("result").textContent="El juez está ejecutando el código…";try{var data=await callTool("submit_code",{problemId:p.id,languageId:lang.id,language:lang.name,sourceCode:$("code").value,stdin:$("stdin").value,expectedOutput:p.sampleOutput||""});var s=data.submission||data;var verdict=s.verdict||"Resultado recibido";var detail=["Veredicto: "+verdict];if(s.stdout)detail.push("stdout:\n"+s.stdout);if(s.stderr)detail.push("stderr:\n"+s.stderr);if(s.compileOutput)detail.push("Compilación:\n"+s.compileOutput);if(s.time)detail.push("Tiempo: "+s.time+" s");if(s.memory)detail.push("Memoria: "+s.memory+" KB");$("result").textContent=detail.join("\n\n");var good=verdict==="Accepted";$("result").className="result "+(good?"good":(verdict==="Wrong Answer"||verdict==="Compilation Error"||verdict==="Runtime Error"?"bad":""));setStatus(verdict,good?"good":"bad")}catch(e){$("result").textContent=e.message;setStatus("Error al ejecutar","bad")}finally{state.busy=false;$("run").disabled=false;$("submit").disabled=false}}
$("run").addEventListener("click",function(){execute(false)});
$("submit").addEventListener("click",function(){execute(true)});
$("reset").addEventListener("click",setCodeForProblem);
document.addEventListener("keydown",function(e){if((e.metaKey||e.ctrlKey)&&e.key==="Enter"){e.preventDefault();execute(false)}});
initialize();
})();
</script>
</body>
