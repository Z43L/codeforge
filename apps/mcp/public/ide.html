<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CodeForge IDE</title>
<style>
:root {
  color-scheme: light dark;
  --fallback-bg: #0b0f14;
  --fallback-panel: #111820;
  --fallback-editor: #0d1117;
  --fallback-border: #26313d;
  --fallback-fg: #d8dee9;
  --fallback-muted: #8b98a8;
  --fallback-green: #7ee787;
  --fallback-red: #ff7b72;
  --fallback-action: #238636;
  --fallback-action-hover: #2ea043;
  --fallback-action-fg: #ffffff;
  --fallback-hover: #202b37;
  --fallback-selection: #264f78;
  --fallback-focus: #3b596f;

  /* Prefer ChatGPT's injected theme tokens; use local palette only as a fallback. */
  --terminal-bg: var(--color-background-primary, var(--fallback-bg));
  --terminal-panel: var(--color-background-secondary, var(--fallback-panel));
  --terminal-editor: var(--color-background-secondary, var(--fallback-editor));
  --terminal-border: var(--color-border, var(--fallback-border));
  --terminal-fg: var(--color-text-primary, var(--fallback-fg));
  --terminal-muted: var(--color-text-secondary, var(--fallback-muted));
  --terminal-green: var(--color-text-success, var(--fallback-green));
  --terminal-red: var(--color-text-danger, var(--fallback-red));
  --terminal-action: var(--color-accent, var(--fallback-action));
  --terminal-action-fg: var(--color-accent-foreground, var(--fallback-action-fg));
  --terminal-hover: var(--color-background-tertiary, var(--fallback-hover));
  --terminal-selection: var(--color-background-inverted, var(--fallback-selection));
  --terminal-focus: var(--color-ring, var(--fallback-focus));
  font-family: var(--font-sans, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
}
@media (prefers-color-scheme: light) {
  :root {
    --fallback-bg: #ffffff;
    --fallback-panel: #f6f8fa;
    --fallback-editor: #ffffff;
    --fallback-border: #d0d7de;
    --fallback-fg: #24292f;
    --fallback-muted: #656d76;
    --fallback-green: #1a7f37;
    --fallback-red: #cf222e;
    --fallback-action: #1f883d;
    --fallback-action-hover: #1a7f37;
    --fallback-action-fg: #ffffff;
    --fallback-hover: #eaeef2;
    --fallback-selection: #ddf4ff;
    --fallback-focus: #0969da;
  }
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; width: 100%; min-width: 0; min-height: 100%;
  background: var(--terminal-bg); color: var(--terminal-fg);
}
body { font-size: 13px; }
button, textarea { font: inherit; }
.shell { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 100%; min-width: 0; }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 28px; padding: 0 2px; }
.brand { color: var(--terminal-fg); font-size: 13px; font-weight: 650; letter-spacing: -.2px; }
.brand-mark { color: var(--terminal-green); font-family: var(--font-mono, ui-monospace, monospace); padding-right: 5px; }
.status { min-width: 0; max-width: 65%; color: var(--terminal-muted); font-size: 11px; text-align: right; overflow-wrap: anywhere; }
.status.good { color: var(--terminal-green); }
.status.bad { color: var(--terminal-red); }
.terminal { overflow: hidden; width: 100%; min-width: 0; border: 1px solid var(--terminal-border); border-radius: 11px; background: var(--terminal-editor); box-shadow: 0 8px 28px rgba(0,0,0,.10); }
.terminal-titlebar { min-height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 12px; background: var(--terminal-panel); border-bottom: 1px solid var(--terminal-border); }
.window-dots { display: inline-flex; gap: 5px; align-items: center; flex: 0 0 auto; }
.dot { display: block; width: 8px; height: 8px; border-radius: 50%; background: var(--terminal-muted); }
.dot.red { background: #ff5f57; }
.dot.yellow { background: #febc2e; }
.dot.green { background: #28c840; }
.tab { display: inline-flex; align-items: center; gap: 7px; min-width: 0; color: var(--terminal-fg); font-family: var(--font-mono, ui-monospace, monospace); font-size: 11px; }
.tab-icon { color: var(--terminal-green); font-size: 12px; }
.lang-pill { margin-left: auto; padding: 3px 7px; border: 1px solid var(--terminal-border); border-radius: 6px; color: var(--terminal-muted); font-family: var(--font-mono, ui-monospace, monospace); font-size: 10px; white-space: nowrap; }
.editor-scroll { display: flex; width: 100%; min-width: 0; height: clamp(300px, 52vh, 620px); min-height: 240px; max-height: 72vh; overflow: auto; background: var(--terminal-editor); }
.gutter { flex: 0 0 44px; margin: 0; padding: 14px 10px 14px 0; border: 0; color: var(--terminal-muted); background: var(--terminal-editor); text-align: right; user-select: none; pointer-events: none; white-space: pre; overflow: hidden; font: 12px/1.7 var(--font-mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace); }
textarea#code { display: block; flex: 1 0 220px; width: 0; min-width: 0; height: 100%; min-height: 100%; margin: 0; padding: 14px 14px 20px 0; resize: none; overflow: auto; border: 0; border-radius: 0; outline: none; background: transparent; color: var(--terminal-fg); caret-color: var(--terminal-green); font: 12px/1.7 var(--font-mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace); tab-size: 4; white-space: pre; overflow-wrap: normal; box-shadow: none; appearance: none; pointer-events: auto; user-select: text; -webkit-user-select: text; }
textarea#code:focus { outline: none; }
textarea#code::selection { background: var(--terminal-selection); }
.io-panel { padding: 10px 12px 12px; border: 1px solid var(--terminal-border); border-radius: 10px; background: var(--terminal-panel); }
.field-label { display: flex; align-items: center; gap: 7px; margin: 0 0 8px; color: var(--terminal-fg); font-size: 11px; font-weight: 650; }
.prompt { color: var(--terminal-green); font-family: var(--font-mono, ui-monospace, monospace); }
textarea#stdin { display: block; width: 100%; min-height: 68px; max-height: 180px; resize: vertical; padding: 9px 10px; border: 1px solid var(--terminal-border); border-radius: 7px; outline: none; background: var(--terminal-bg); color: var(--terminal-fg); caret-color: var(--terminal-green); font: 12px/1.6 var(--font-mono, ui-monospace, monospace); pointer-events: auto; user-select: text; -webkit-user-select: text; }
textarea#stdin:focus { border-color: var(--terminal-focus); }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; min-width: 0; }
button { cursor: pointer; padding: 7px 11px; border: 1px solid var(--terminal-border); border-radius: 7px; background: var(--terminal-panel); color: var(--terminal-fg); font-size: 11px; font-weight: 600; }
button:hover:not(:disabled) { background: var(--terminal-hover); }
button:disabled { opacity: .5; cursor: wait; }
button.primary { background: var(--terminal-action); border-color: var(--terminal-action); color: var(--terminal-action-fg); }
button.primary:hover:not(:disabled) { filter: brightness(.94); }
button.secondary { background: transparent; }
.actions .status { max-width: 100%; margin-left: auto; }
.result-terminal { overflow: hidden; border: 1px solid var(--terminal-border); border-radius: 10px; background: var(--terminal-editor); }
.result-head { display: flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 12px; border-bottom: 1px solid var(--terminal-border); background: var(--terminal-panel); }
.result-title { color: var(--terminal-fg); font-size: 11px; font-weight: 650; }
.result-live { margin-left: auto; color: var(--terminal-muted); font: 10px var(--font-mono, ui-monospace, monospace); }
pre#result { min-height: 48px; max-height: 220px; overflow: auto; margin: 0; padding: 12px; color: var(--terminal-muted); white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.65 var(--font-mono, ui-monospace, monospace); }
pre#result.good { color: var(--terminal-green); }
pre#result.bad { color: var(--terminal-red); }
@media (max-width: 520px) {
  .shell { gap: 10px; }
  .terminal-titlebar { padding: 0 9px; }
  .editor-scroll { height: 48vh; min-height: 220px; }
  .gutter { flex-basis: 34px; padding-right: 8px; }
  textarea#code { padding-right: 10px; font-size: 11px; }
  .actions button { flex: 1 1 auto; }
  .actions .status { width: 100%; margin-left: 0; text-align: left; }
  .status { max-width: 58%; }
}
</style>
</head>
<body>
<main class="shell">
  <header class="topbar">
    <span class="brand"><span class="brand-mark">&gt;_</span>CodeForge</span>
    <span id="connection" class="status">Preparando editor…</span>
  </header>

  <section class="terminal" aria-label="Editor de código estilo terminal">
    <div class="terminal-titlebar">
      <span class="window-dots" aria-hidden="true"><i class="dot red"></i><i class="dot yellow"></i><i class="dot green"></i></span>
      <span class="tab"><span class="tab-icon">●</span><span id="fileName">solution.cpp</span></span>
      <span id="languageHint" class="lang-pill">C++</span>
      <button id="reset" class="secondary" type="button">Restaurar</button>
    </div>
    <div class="editor-scroll" id="editorScroll">
      <pre id="lineNumbers" class="gutter" aria-hidden="true">1</pre>
      <textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-label="Editor de código" placeholder="// Escribe tu solución aquí"></textarea>
    </div>
  </section>

  <section class="io-panel">
    <label class="field-label" for="stdin"><span class="prompt">$</span> Entrada de prueba (stdin)</label>
    <textarea id="stdin" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Entrada estándar" placeholder="Escribe la entrada de prueba aquí"></textarea>
  </section>

  <div class="actions">
    <button id="run" class="primary" type="button">▶ Ejecutar</button>
    <button id="submit" type="button">Enviar solución</button>
    <span id="runStatus" class="status">Editor listo</span>
  </div>

  <section class="result-terminal" aria-label="Resultado de ejecución">
    <div class="result-head"><span class="result-title"><span class="prompt">$</span> output</span><span class="result-live">JUDGE OUTPUT</span></div>
    <pre id="result">La salida del juez aparecerá aquí.</pre>
  </section>
</main>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var state = { problem: null, languages: [], activeLanguage: null, initialCode: "", busy: false };
  var fallbackLanguages = [
    { id: 54, name: "C++" }, { id: 50, name: "C" }, { id: 71, name: "Python 3" },
    { id: 62, name: "Java" }, { id: 63, name: "JavaScript" }, { id: 74, name: "TypeScript" }
  ];
  var templates = {
    "C++": "#include <iostream>\n#include <vector>\n#include <unordered_map>\nusing namespace std;\n\nint main() {\n    int n, target;\n    cin >> n;\n    vector<int> nums(n);\n    for (int i = 0; i < n; ++i) cin >> nums[i];\n    cin >> target;\n\n    unordered_map<int, int> seen;\n    for (int i = 0; i < n; ++i) {\n        int other = target - nums[i];\n        if (seen.count(other)) {\n            cout << seen[other] << \" \" << i << \"\\n\";\n            return 0;\n        }\n        seen[nums[i]] = i;\n    }\n    return 0;\n}\n",
    "C": "#include <stdio.h>\n\nint main(void) {\n    /* Escribe tu solución aquí. */\n    return 0;\n}\n",
    "Python 3": "import sys\n\ndef main():\n    data = list(map(int, sys.stdin.read().split()))\n    # Escribe tu solución aquí.\n\nif __name__ == \"__main__\":\n    main()\n",
    "JavaScript": "const fs = require('fs');\nconst input = fs.readFileSync(0, 'utf8').trim();\n\n// Escribe tu solución aquí.\n",
    "TypeScript": "import * as fs from 'fs';\nconst input: string = fs.readFileSync(0, 'utf8').trim();\n\n// Escribe tu solución aquí.\n",
    "Java": "import java.io.*;\nimport java.util.*;\n\npublic class Main {\n    public static void main(String[] args) throws Exception {\n        // Escribe tu solución aquí.\n    }\n}\n"
  };
  var defaults = {
    "two-sum": "4\n2 7 11 15\n9",
    "valid-palindrome": "A man, a plan, a canal: Panama",
    "max-subarray": "9\n-2 1 -3 4 -1 2 1 -5 4"
  };
  var rpcId = 0;
  var pending = new Map();
  var bridgeReady;

  function setStatus(message, kind) {
    $("runStatus").textContent = message;
    $("runStatus").className = "status" + (kind ? " " + kind : "");
  }
  function setConnection(message, kind) {
    $("connection").textContent = message;
    $("connection").className = "status" + (kind ? " " + kind : "");
  }
  function languageName() {
    return (state.activeLanguage && state.activeLanguage.name) || "C++";
  }
  function templateFor(language) {
    return templates[language] || ("// Escribe aquí tu solución en " + language + ".\n");
  }
  function setLineNumbers() {
    var count = Math.max(1, $("code").value.split("\n").length);
    var lines = "";
    for (var i = 1; i <= count; i++) lines += i + (i < count ? "\n" : "");
    $("lineNumbers").textContent = lines;
    $("lineNumbers").scrollTop = $("code").scrollTop;
  }
  function syncScroll() { $("lineNumbers").scrollTop = $("code").scrollTop; }
  function starterFor(problem) {
    var lang = languageName();
    if (problem && problem.starterCode && problem.starterCode[lang]) return problem.starterCode[lang];
    return templateFor(lang);
  }
  function setCodeForProblem() {
    if (!state.problem) return;
    var lang = languageName();
    $("fileName").textContent = lang === "C++" ? "solution.cpp" :
      lang === "Python 3" ? "solution.py" :
      lang === "JavaScript" ? "solution.js" :
      lang === "TypeScript" ? "solution.ts" :
      lang === "Java" ? "Main.java" : "solution.c";
    $("languageHint").textContent = lang;
    state.initialCode = starterFor(state.problem);
    $("code").value = state.initialCode;
    $("stdin").value = state.problem.sampleInput || defaults[state.problem.id] || "";
    $("result").textContent = "La salida del juez aparecerá aquí.";
    $("result").className = "";
    setStatus("Editor listo");
    setLineNumbers();
  }
  function normalizeData(response) {
    if (!response) return null;
    if (response.structuredContent) return response.structuredContent;
    if (response.result && response.result.structuredContent) return response.result.structuredContent;
    if (response.data && response.data.structuredContent) return response.data.structuredContent;
    return response;
  }
  function fillLanguages(items, preferredName) {
    state.languages = items && items.length ? items : fallbackLanguages;
    var requested = (preferredName || "C++").toLowerCase();
    state.activeLanguage = state.languages.find(function (item) {
      return item.name && item.name.toLowerCase() === requested;
    }) || state.languages.find(function (item) {
      return item.name && item.name.toLowerCase().indexOf(requested) === 0;
    }) || state.languages.find(function (item) {
      return item.name === "C++";
    }) || state.languages[0] || fallbackLanguages[0];
    $("languageHint").textContent = state.activeLanguage.name;
    if (state.problem) setCodeForProblem();
  }
  function renderProblem(problem) {
    if (!problem || !problem.id) return;
    state.problem = problem;
    setCodeForProblem();
    setConnection("Reto cargado", "good");
  }
  function updateFromResponse(response) {
    var data = normalizeData(response);
    if (!data) return;
    if (data.languages) fillLanguages(data.languages, data.selectedLanguage);
    if (data.problem) renderProblem(data.problem);
    if (data.submission) renderSubmission(data.submission);
  }
  function renderSubmission(submission) {
    var result = submission || {};
    var verdict = result.verdict || "Resultado recibido";
    var lines = ["Veredicto: " + verdict];
    if (result.stdout) lines.push("stdout:\n" + result.stdout);
    if (result.stderr) lines.push("stderr:\n" + result.stderr);
    if (result.compileOutput) lines.push("Compilación:\n" + result.compileOutput);
    if (result.time) lines.push("Tiempo: " + result.time + " s");
    if (result.memory) lines.push("Memoria: " + result.memory + " KB");
    $("result").textContent = lines.join("\n\n");
    var accepted = verdict === "Accepted";
    $("result").className = accepted ? "good" :
      (verdict === "Wrong Answer" || verdict === "Compilation Error" || verdict === "Runtime Error" ? "bad" : "");
    setStatus(verdict, accepted ? "good" : ( $("result").className === "bad" ? "bad" : ""));
  }
  function rpcNotify(method, params) {
    window.parent.postMessage({ jsonrpc: "2.0", method: method, params: params || {} }, "*");
  }
  function rpcRequest(method, params) {
    return new Promise(function (resolve, reject) {
      var id = ++rpcId;
      var timer = setTimeout(function () {
        pending.delete(id);
        reject(new Error("ChatGPT no respondió a " + method + ". El editor sigue disponible, pero las acciones del juez necesitan una conexión MCP activa."));
      }, 10000);
      pending.set(id, {
        resolve: function (value) { clearTimeout(timer); resolve(value); },
        reject: function (error) { clearTimeout(timer); reject(error); }
      });
      window.parent.postMessage({ jsonrpc: "2.0", id: id, method: method, params: params || {} }, "*");
    });
  }
  window.addEventListener("message", function (event) {
    if (event.source !== window.parent) return;
    var message = event.data;
    if (!message || message.jsonrpc !== "2.0") return;
    if (Object.prototype.hasOwnProperty.call(message, "id")) {
      var request = pending.get(message.id);
      if (!request) return;
      pending.delete(message.id);
      if (message.error) request.reject(new Error(message.error.message || JSON.stringify(message.error)));
      else request.resolve(message.result);
      return;
    }
    if (message.method === "ui/notifications/tool-result" ||
        message.method === "ui/notifications/tool-input" ||
        message.method === "openai/tool-result") {
      updateFromResponse(message.params || message.result || message);
    }
  }, { passive: true });

  async function initializeBridge() {
    await rpcRequest("ui/initialize", {
      appInfo: { name: "codeforge-ide", version: "0.3.0" },
      appCapabilities: {},
      protocolVersion: "2026-01-26"
    });
    rpcNotify("ui/notifications/initialized", {});
  }
  bridgeReady = initializeBridge().then(function () {
    setConnection("MCP conectado", "good");
  }).catch(function (error) {
    setConnection("Editor local · MCP sin conexión", "bad");
    $("result").textContent = error.message;
    return null;
  });
  async function callTool(name, args) {
    await bridgeReady;
    var response = await rpcRequest("tools/call", { name: name, arguments: args || {} });
    if (response && response.isError) {
      var message = (response.content || []).filter(function (item) { return item.type === "text"; })
        .map(function (item) { return item.text; }).join("\n");
      throw new Error(message || ("La herramienta " + name + " ha fallado"));
    }
    return normalizeData(response) || {};
  }
  async function execute() {
    if (state.busy) return;
    if (!state.problem) {
      setStatus("Esperando el reto desde ChatGPT", "bad");
      return;
    }
    var lang = state.activeLanguage || fallbackLanguages[0];
    state.busy = true;
    $("run").disabled = true;
    $("submit").disabled = true;
    setStatus("Ejecutando…");
    $("result").textContent = "El juez está ejecutando el código…";
    $("result").className = "";
    try {
      var data = await callTool("submit_code", {
        problemId: state.problem.id,
        languageId: lang.id,
        language: lang.name,
        sourceCode: $("code").value,
        stdin: $("stdin").value || "",
        expectedOutput: state.problem.sampleOutput || ""
      });
      renderSubmission(data.submission || data);
    } catch (error) {
      $("result").textContent = error.message || String(error);
      $("result").className = "bad";
      setStatus("Error al ejecutar", "bad");
    } finally {
      state.busy = false;
      $("run").disabled = false;
      $("submit").disabled = false;
    }
  }

  $("code").addEventListener("input", setLineNumbers);
  $("code").addEventListener("scroll", syncScroll, { passive: true });
  $("code").addEventListener("keydown", function (event) {
    if (event.key === "Tab") {
      event.preventDefault();
      var start = this.selectionStart;
      var end = this.selectionEnd;
      var value = this.value;
      this.value = value.slice(0, start) + "    " + value.slice(end);
      this.selectionStart = this.selectionEnd = start + 4;
      setLineNumbers();
    } else if (event.key === "Enter") {
      var startPos = this.selectionStart;
      var previousLine = this.value.slice(0, startPos).split("\n").pop();
      var indentation = (previousLine.match(/^\s*/) || [""])[0];
      if (indentation) {
        event.preventDefault();
        var value = this.value;
        this.value = value.slice(0, startPos) + "\n" + indentation + value.slice(this.selectionEnd);
        this.selectionStart = this.selectionEnd = startPos + 1 + indentation.length;
        setLineNumbers();
      }
    }
  });
  $("run").addEventListener("click", execute);
  $("submit").addEventListener("click", execute);
  $("reset").addEventListener("click", function () {
    $("code").value = state.initialCode || templateFor(languageName());
    setLineNumbers();
    setStatus("Código restaurado");
    $("code").focus();
  });


  function syncColorScheme() {
    try {
      var background = getComputedStyle(document.body).backgroundColor;
      var rgb = background.match(/[\d.]+/g);
      if (rgb && rgb.length >= 3) {
        var channels = rgb.slice(0, 3).map(function (value) {
          value = Number(value) / 255;
          return value <= 0.03928 ? value / 12.92 : Math.pow((value + 0.055) / 1.055, 2.4);
        });
        var luminance = 0.2126 * channels[0] + 0.7152 * channels[1] + 0.0722 * channels[2];
        document.documentElement.style.colorScheme = luminance > 0.52 ? "light" : "dark";
      }
    } catch (_) {}
  }
  syncColorScheme();
  if (typeof MutationObserver !== "undefined") {
    new MutationObserver(syncColorScheme).observe(document.documentElement, { attributes: true, attributeFilter: ["class", "style"] });
    new MutationObserver(syncColorScheme).observe(document.body, { attributes: true, attributeFilter: ["class", "style"] });
  }

  /* Make the editor immediately editable even before the MCP host completes initialization. */
  state.problem = {
    id: "two-sum",
    title: "Pair With Target",
    sampleInput: defaults["two-sum"],
    starterCode: {}
  };
  state.activeLanguage = fallbackLanguages[0];
  setCodeForProblem();
  setLineNumbers();
  $("code").focus({ preventScroll: true });
})();
</script>
</body>
</html>
